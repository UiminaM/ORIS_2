{% extends "base.html" %}

{% block title %}Список курсов{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Список курсов</h2>
    <a href="{{ url_for('course.create') }}" class="btn btn-primary">Добавить курс</a>
</div>

<div class="row">
    {% for course in courses %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">
                    <a href="{{ url_for('course.view', course_id=course.id) }}" class="text-decoration-none">{{ course.title }}</a>
                </h5>
                <p class="card-text">{{ course.description }}</p>
                <p class="card-text"><small class="text-muted">Длительность: {{ course.duration_hours }} ч.</small></p>
                <div class="btn-group">
                    <a href="{{ url_for('course.update', course_id=course.id) }}" class="btn btn-warning">Редактировать</a>
                    <a href="{{ url_for('course.delete', course_id=course.id) }}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
