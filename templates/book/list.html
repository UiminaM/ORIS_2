{% extends "base.html" %}

{% block title %}Список книг{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Список книг</h2>
    <a href="{{ url_for('book.create') }}" class="btn btn-primary">Добавить книгу</a>
</div>

<div class="row">
    {% for book in books %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">
                    <a href="{{ url_for('book.view', book_id=book.id) }}" class="text-decoration-none">{{ book.title }}</a>
                </h5>
                <p class="card-text">{{ book.annotation }}</p>
                <p class="card-text"><small class="text-muted">Год издания: {{ book.year }}</small></p>
                <div class="btn-group">
                    <a href="{{ url_for('book.update', book_id=book.id) }}" class="btn btn-warning">Редактировать</a>
                    <a href="{{ url_for('book.delete', book_id=book.id) }}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
