{% extends "base.html" %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="card-title">{{ book.title }}</h1>
        <p class="card-text">{{ book.annotation }}</p>
        <p class="card-text"><small class="text-muted">Год издания: {{ book.year }}</small></p>
        <div class="btn-group">
            <a href="{{ url_for('book.update', book_id=book.id) }}" class="btn btn-warning">Редактировать</a>
            <a href="{{ url_for('book.delete', book_id=book.id) }}" class="btn btn-danger">Удалить</a>
            <a href="{{ url_for('book.list') }}" class="btn btn-secondary">Назад к списку</a>
        </div>
    </div>
</div>
{% endblock %}
